<div class="min-h-screen flex">

  <!-- Panel izquierdo: degradado morado -->
  <div class="hidden md:flex md:w-1/2 bg-linear-to-br from-panel-from to-panel-to items-center justify-center p-12">
    <div class="text-center">
      <div class="bg-white rounded-xl px-6 py-4 inline-block mb-6">
        <img src="/logo-montevilla.png" alt="Veterinaria Monte Villa" class="max-w-xs" />
      </div>
      <p class="text-white text-lg font-medium">
        Sistema de Gestión Clínica y Administrativa
      </p>
    </div>
  </div>

  <!-- Panel derecho -->
  <div class="w-full md:w-1/2 flex items-center justify-center p-8 bg-white">

    <div class="w-full max-w-md">

      <h1 class="text-3xl font-bold text-primary-dark mb-2">
        Restablecer contraseña
      </h1>

      <p class="text-gray-500 mb-6">
        Ingrese su nueva contraseña para recuperar el acceso al sistema.
      </p>

      <div class="border-t border-gray-200 mb-6"></div>
      @if (errorMensaje) {
        <div class="bg-red-50 border border-red-200 text-red-700 rounded-lg p-4 mb-6">
            {{ errorMensaje }}
        </div>
        }

      <form
        [formGroup]="resetPasswordForm"
        (ngSubmit)="onSubmit()"
        class="space-y-5">

        <div>
          <label
            for="nuevaContrasena"
            class="block text-sm font-medium text-gray-700 mb-1">
            Nueva contraseña
          </label>

          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
              🔒
            </span>

            <input
              id="nuevaContrasena"
              type="password"
              formControlName="nuevaContrasena"
              class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary"
            />
          </div>
        </div>

        <div>
          <label
            for="confirmarContrasena"
            class="block text-sm font-medium text-gray-700 mb-1">
            Confirmar contraseña
          </label>

          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
              🔒
            </span>

            <input
              id="confirmarContrasena"
              type="password"
              formControlName="confirmarContrasena"
              class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary"
            />
          </div>
        </div>

        <button
          type="submit"
          [disabled]="resetPasswordForm.invalid"
          class="w-full bg-primary text-white font-semibold py-2.5 rounded-lg hover:bg-primary-dark transition disabled:opacity-40 disabled:cursor-not-allowed">
          Actualizar contraseña
        </button>

      </form>

    </div>

  </div>

</div>
