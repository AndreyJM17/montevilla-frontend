<div class="min-h-screen flex flex-col">

    <!-- Topbar -->
    <header class="h-16 bg-surface-light border-b border-purple-200 flex items-center justify-between px-4 md:px-8">

        <div class="flex items-center gap-3 min-w-0">
            <button (click)="toggleSidebar()" class="md:hidden p-2 rounded-lg text-primary hover:bg-purple-100 transition shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
            <h1 class="text-lg sm:text-xl md:text-2xl font-semibold text-primary truncate">Veterinaria Montevilla</h1>
        </div>

    </header>

    @if (sidebarAbierto()) {
        <div class="fixed inset-0 bg-black/40 z-20 md:hidden" (click)="cerrarSidebar()"></div>
    }

    <div class="flex flex-1 relative">

        <aside class="fixed inset-y-0 left-0 z-30 w-64 bg-sidebar flex flex-col transition-transform duration-300 md:static md:translate-x-0 md:z-auto top-16"
               [class.translate-x-0]="sidebarAbierto()"
               [class.-translate-x-full]="!sidebarAbierto()">

            <div class="p-6">
                <div class="bg-white rounded-xl px-4 py-3">
                    <img src="/logo-montevilla.png" alt="Veterinaria Monte Villa" class="w-full h-auto" />
                </div>
            </div>

            <nav class="flex-1 px-3 space-y-2">
                <a (click)="cerrarSidebar()" routerLink="/mis-citas" routerLinkActive="bg-white text-primary font-semibold" class="block px-4 py-3 rounded-lg text-white hover:bg-white/20 transition">Mis Citas</a>
            </nav>

            <div class="p-5 border-t border-white/20">
                <button (click)="cerrarSesion()" class="text-white hover:underline">Cerrar sesión</button>
            </div>

        </aside>

            

        <main class="flex-1 bg-gray-50 p-4 md:p-8 min-w-0">
            <router-outlet />
        </main>

        

    </div>

</div>
